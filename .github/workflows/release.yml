name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
      - id: setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - id: install-deps
        name: Install dependencies
        run: |
          bun install
      - id: update-package-version
        name: Update package version
        run: |
          npm --no-git-tag-version version ${GITHUB_REF_NAME#v}
      - id: build
        name: Build
        run: |
          bun run build
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          package-manager-cache: false
      - name: Update npm for OIDC support
        run: npm install -g npm@latest
      - run: npm publish --provenance
